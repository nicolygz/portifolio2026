<div
  class="fixed inset-0 z-50 hidden bg-[#08080a]/80 backdrop-blur-md flex items-center justify-center p-6"
  id="project-modal"
>
  <div
    class="relative bg-surface-container-low border border-outline-variant/50 max-w-lg w-full rounded-2xl p-8 shadow-2xl space-y-6"
  >
    <div class="flex items-center justify-between">
      <h3 class="font-headline text-xl text-on-surface font-bold" id="modal-title">
        Detalhes do Projeto
      </h3>
      <button
        class="w-9 h-9 rounded-full bg-surface-container hover:bg-surface-bright flex items-center justify-center text-on-surface hover:text-primary transition-colors border border-outline-variant/30"
        data-modal-close
      >
        <span class="material-symbols-outlined text-base">close</span>
      </button>
    </div>
    <p class="font-body text-sm text-on-surface-variant leading-relaxed" id="modal-desc">
      Descrição do projeto.
    </p>
    <div class="pt-2 flex items-center justify-end gap-3">
      <button
        class="px-5 py-2.5 rounded-xl bg-surface-container text-on-surface font-label text-xs uppercase tracking-wider hover:bg-surface-bright transition-colors border border-outline-variant/30"
        data-modal-close
      >
        Fechar
      </button>
      <a
        class="px-5 py-2.5 rounded-xl bg-primary text-on-primary font-label text-xs uppercase tracking-wider hover:bg-secondary-fixed transition-colors font-semibold flex items-center gap-1.5"
        href="#"
        id="modal-link"
        rel="noreferrer"
        target="_blank"
      >
        <span class="">Abrir no GitHub</span>
        <span class="material-symbols-outlined text-sm">open_in_new</span>
      </a>
    </div>
  </div>
</div>
