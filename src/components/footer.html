<footer
  class="w-full bg-[#08080a] border-t border-outline-variant/30 text-on-surface-variant py-14"
>
  <div class="container-page">
    <div
      class="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 pb-10 border-b border-outline-variant/20"
    >
      <div class="space-y-2">
        <div class="flex items-center gap-3">
          <span class="font-headline text-xl text-on-surface font-bold"
            >Nicoly Guedes de Abreu</span
          >
          <span
            class="font-label text-xs text-primary uppercase px-2.5 py-0.5 rounded-full bg-surface-container border border-primary/30"
            >Software Dev</span
          >
        </div>
        <p class="font-body text-sm text-outline">
          Desenvolvimento de Software Multiplataforma • Fatec São José dos Campos
        </p>
      </div>
      <div class="flex items-center gap-8">
        <a
          class="font-label text-xs uppercase tracking-wider text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2"
          href="{{site.github}}"
          rel="noreferrer"
          target="_blank"
        >
          <span class="material-symbols-outlined text-base">terminal</span>
          <span class="">GitHub</span>
        </a>
        <a
          class="font-label text-xs uppercase tracking-wider text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2"
          href="{{site.linkedin}}"
          rel="noreferrer"
          target="_blank"
        >
          <span class="material-symbols-outlined text-base">share</span>
          <span class="">LinkedIn</span>
        </a>
        <a
          class="font-label text-xs uppercase tracking-wider text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2"
          href="mailto:{{site.email}}"
        >
          <span class="material-symbols-outlined text-base">mail</span>
          <span class="">Email</span>
        </a>
      </div>
    </div>
    <div
      class="pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 font-label text-xs text-outline"
    >
      <p>© <span data-year></span> {{site.name}}. Todos os direitos reservados.</p>
    </div>
  </div>
</footer>
